; Configuración de PHP para la ferreteria.
; Valores pensados para una PyME: carga baja y errores visibles.

[PHP]
; El límite de memoria holga para el cálculo de la matriz de variantes y la
; conciliación de stock, que son las operaciones más pesadas del sistema.
memory_limit = 256M

; Errores a pantalla solo en desarrollo: en producción un error con detalle
; puede mostrar rutas internas o consultas SQL a un visitante.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL

; Fecha y hora: la ferreteria opera en horario de Chile.
date.timezone = America/Santiago

; Sesión y cookies
session.cookie_httponly = 1
; `use_strict_mode` obliga al navegador a mandar el id de sesión que le dio el
; servidor: sin esto, un id inventado por alguien más sería aceptado.
session.use_strict_mode = 1
session.use_only_cookies = 1

; No exponer la versión de PHP en las cabeceras.
expose_php = Off

[opcache]
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0